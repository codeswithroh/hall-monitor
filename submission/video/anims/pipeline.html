<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="_base.css"></head><body><div id="root"></div><script>
const cue=(re,f)=>(window.CUES||[]).find(c=>re.test(c.text))?.t??f;
const clamp=x=>Math.max(0,Math.min(1,x));const ease=(t,t0,d=.5)=>1-Math.pow(1-clamp((t-t0)/d),3);
const pop=(t,t0)=>{const p=clamp((t-t0)/.45);return p<=0?0:1+Math.sin(p*Math.PI)*.12*(1-p)+(1-Math.pow(1-p,3))-1};
const A=cue(/Chainlink CRE|hood/i,.2), O=cue(/Each node/i,3), G=O+1.1, M=O+2.3, S=cue(/signed report/i,6.4)+0.7, P=S+1.7;
const ST=[["Observe","every node fetches",O,"globe"],["Agree","identical consensus",G,"nodes"],["Map","16 CFR 312 rules",M,"scale"],["Seal","signed report",S,"seal"],["Persist","first & last seen",P,"clock"]];
const IC={globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',nodes:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/>',scale:'<path d="M12 3v18M5 21h14M3 7h18M6 7l-3 7a3 3 0 0 0 6 0L6 7M18 7l-3 7a3 3 0 0 0 6 0l-3-7"/>',seal:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'};
window.seek=t=>{let h='';const a=ease(t,A,.6);
 h+=`<div class="abs h" style="left:0;right:0;top:120px;text-align:center;font-size:58px;opacity:${a}">Chainlink CRE workflow</div>`;
 ST.forEach(([n,sub,t0,ic],i)=>{const on=t>=t0, s=ease(t,A+.2+i*.12,.5), x=150+i*340;
  h+=`<div class="abs card" style="left:${x}px;top:360px;width:280px;height:300px;opacity:${s};transform:translateY(${(1-s)*30}px);border:3px solid ${on?'#18b26b':'transparent'};display:grid;justify-items:center;align-content:center;gap:16px">
   <div style="width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:${on?'#18b26b':'#f6f6f8'};color:${on?'#fff':'#8a8c94'};transform:scale(${on?1+0.15*Math.max(0,1-(t-t0)/.4):1})"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${IC[ic]}</svg></div>
   <b style="font-size:36px;font-weight:600">${n}</b><span style="color:#8a8c94;font-size:22px">${sub}</span></div>`;
  if(i<4) h+=`<div class="abs" style="left:${x+282}px;top:508px;width:56px;border-top:4px ${t>=ST[i+1][2]?'solid #18b26b':'dashed #c9cad1'}"></div>`});
 const c=pop(t,P);
 h+=`<div class="abs" style="left:0;right:0;top:760px;display:flex;justify-content:center;transform:scale(${c});opacity:${clamp(c*2)}"><span class="pill ink" style="font-size:30px"><span style="color:#3EE07F">●</span> HallMonitor.onReport · Ethereum Sepolia</span></div>`;
 document.getElementById('root').innerHTML=h};window.seek(0);
</script></body></html>
